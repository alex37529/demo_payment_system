# phase-6 spec §4.5: the built frontend is served statically; /v1 is proxied to
# the gateway (BFF, compose DNS `gateway`). SSE must stream, so buffering is
# disabled on the proxied /v1 paths (X-Accel-Buffering: no is set by the
# gateway, but disable client-side buffering too — pitfall #8).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-ish fallback (single page; harmless)
    location / {
        try_files $uri /index.html;
    }

    # Proxy the API + SSE feed to the gateway. Disable response buffering and
    # idle timeouts so the SSE keepalive reaches the browser.
    location /v1/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept $http_accept;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
