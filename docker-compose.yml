name: fintech_demo

# fintech_demo — data + CDC + observability stack + 8 app services.
# Port map: doc/tz_v2.md §4.1.
#
# CONTAINER NAMING: fintech_ prefix; our services -> <name>_service; infra -> clean base name.
# Compose SERVICE KEYS keep short names (DNS discovery); container_name sets the docker ps name.
# --- log driver -------------------------------------------------------------
# Docker's default `local` driver writes GZIPPED logs to
# `<id>/local-logs/container.log`, which promtail cannot parse (it tails
# `<id>/<id>-json.log`, the `json-file` format). With `local`, Loki received
# NOTHING at all — promtail only ever saw the stale `-json.log` files of dead
# containers (phase-7 finding).
#
# `json-file` + the `docker` promtail stage is the supported combination:
# the container's stdout is one JSON object per line, unwrapped into
# {"log":...,"stream":...,"time":...} and parsed into Loki labels (service/level).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  # ---------------------- data stack ----------------------
  postgres:
    image: postgres:16
    container_name: fintech_postgres
    logging: *default-logging
    command: >
      postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_size=2GB
    environment:
      POSTGRES_PASSWORD: fintech
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/01_databases.sql:/docker-entrypoint-initdb.d/01.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [fintech]

  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    logging: *default-logging
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [fintech]

  kafka:
    image: apache/kafka:3.7.0
    container_name: fintech_kafka
    logging: *default-logging
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka/topics.sh:/opt/kafka/bin/fintech-topics.sh:ro
    networks: [fintech]

  # Our one-shot helper: creates the 6 topics once kafka is healthy (idempotent).
  kafka-topics:
    image: apache/kafka:3.7.0
    container_name: fintech_kafka_topics_init
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
    command: ["/opt/kafka/bin/fintech-topics.sh"]
    volumes:
      - ./kafka/topics.sh:/opt/kafka/bin/fintech-topics.sh:ro
    networks: [fintech]

  kafka-connect:
    image: debezium/connect:2.5
    container_name: fintech_kafka_connect
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "fintech-connect"
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/kafka/connect"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [fintech]

  # Our one-shot helper: registers the Debezium ledger-outbox connector (stdlib).
  debezium:
    image: python:3.11-slim
    container_name: fintech_debezium_register
    logging: *default-logging
    depends_on:
      kafka-connect:
        condition: service_healthy
    environment:
      CONNECT_URL: "http://kafka-connect:8083"
    volumes:
      - ./kafka/connect:/app/config:ro
      - ./scripts/register_connector.py:/app/register.py:ro
    entrypoint: ["python", "/app/register.py"]
    networks: [fintech]
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 1

  # ---------------------- observability (third-party) ----------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fintech_prometheus
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [fintech]

  tempo:
    image: grafana/tempo:2.5.0
    container_name: fintech_tempo
    logging: *default-logging
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    networks: [fintech]

  loki:
    image: grafana/loki:3.1.0
    container_name: fintech_loki
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.conf"]
    volumes:
      - ./observability/loki/loki.conf:/etc/loki/loki.conf:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [fintech]

  promtail:
    image: grafana/promtail:3.1.0
    container_name: fintech_promtail
    logging: *default-logging
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./observability/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_data:/promtail
    networks: [fintech]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fintech_alertmanager
    logging: *default-logging
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks: [fintech]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fintech_grafana
    logging: *default-logging
    environment:
      # The admin password is BOOTSTRAP-only: Grafana reads it when it creates
      # its database (first start, or after `make clean` wiped the volume)
      # and ignores it afterwards. Making it an input (from .env) keeps it
      # DETERMINISTIC across rebuilds — you never have to set the password
      # again in the UI. See .env.example.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Local PoC: the dashboard opens without a login (the stack is bound to
      # localhost). The login form stays available for the admin account.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      # Brute-force protection LOCKS the admin account for 5 minutes after 5
      # failed logins in 5 minutes — and while it is locked, even the CORRECT
      # password is refused ("Invalid username or password"). On a local PoC
      # that is pure friction (a typo locks you out of the demo), so it is off.
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "true"
    depends_on:
      - prometheus
      - loki
      - tempo
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [fintech]

  # ---------------------- our 8 app services (shared Dockerfile, SERVICE_NAME) ----------------------
  # Each = same image (build once), different SERVICE_NAME + host port. See doc/tz_v2.md §4.1 for the
  # fixed port map. DSNs point at `postgres` service (4 bases in one container).
  gateway:
    build: { context: ., args: { SERVICE_NAME: gateway } }
    container_name: fintech_gateway_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      KAFKA_BROKERS: "kafka:9092"
      LEDGER_ENABLE_CONSUMER: "0"
      # BFF downstream targets (compose DNS names, internal :8080), tz_v2 §4.1.
      INTAKE_BASE_URL: "http://intake:8080"
      PROFILE_BASE_URL: "http://profile:8080"
      NOTIFICATION_BASE_URL: "http://notification:8080"
      ORCHESTRATOR_BASE_URL: "http://orchestrator:8080"
      # Dev CORS: allow the Vite dev origin (5173) when not proxied. In Docker
      # the nginx frontend serves from :5173 and proxies /v1 (same origin), so
      # CORS is a no-op there — this covers the local `vite dev` case (spec §4.4).
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8000:8080"]
    networks: [fintech]

  intake:
    build: { context: ., args: { SERVICE_NAME: intake } }
    container_name: fintech_intake_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      KAFKA_BROKERS: "kafka:9092"
      INTAKE_DSN: "postgresql+asyncpg://fintech:fintech@postgres:5432/intake"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8001:8080"]
    networks: [fintech]

  orchestrator:
    build: { context: ., args: { SERVICE_NAME: orchestrator } }
    container_name: fintech_orchestrator_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      KAFKA_BROKERS: "kafka:9092"
      ORCHESTRATOR_DSN: "postgresql+asyncpg://fintech:fintech@postgres:5432/orchestrator"
      FRAUD_URL: "http://mock-fraud:8080"
      ORCH_WATCHDOG_S: "30"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8002:8080"]
    networks: [fintech]

  ledger:
    build: { context: ., args: { SERVICE_NAME: ledger } }
    container_name: fintech_ledger_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      KAFKA_BROKERS: "kafka:9092"
      LEDGER_DSN: "postgresql+asyncpg://fintech:fintech@postgres:5432/ledger"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }
    ports: ["8003:8080"]
    networks: [fintech]

  profile:
    build: { context: ., args: { SERVICE_NAME: profile } }
    container_name: fintech_profile_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      KAFKA_BROKERS: "kafka:9092"
      PROFILE_DSN: "postgresql+asyncpg://fintech:fintech@postgres:5432/profile"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8004:8080"]
    networks: [fintech]

  notification:
    build: { context: ., args: { SERVICE_NAME: notification } }
    container_name: fintech_notification_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8005:8080"]
    networks: [fintech]

  mock-acquirer:
    build: { context: ., args: { SERVICE_NAME: mock-acquirer } }
    container_name: fintech_mock_acquirer_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      # Where the generator POSTs create-payments (Intake, compose DNS).
      INTAKE_URL: "http://intake:8080"
    depends_on:
      - intake
    ports: ["8006:8080"]
    networks: [fintech]

  mock-fraud:
    build: { context: ., args: { SERVICE_NAME: mock-fraud } }
    container_name: fintech_mock_fraud_service
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8007:8080"]
    networks: [fintech]

  # ---------------------- frontend (phase 6) ----------------------
  # Build the React/Vite app (node:20-alpine) and serve it via nginx. The
  # nginx config proxies /v1 -> gateway:8080 (BFF). Port 5173 (NOT 3000 — that
  # is Grafana, tz_v2 §4.1).
  frontend:
    build: { context: ./frontend }
    container_name: fintech_frontend
    logging: *default-logging
    depends_on:
      - gateway
    ports: ["5173:80"]
    networks: [fintech]

volumes:
  pgdata:
  kafka_data:
  prometheus_data:
  tempo_data:
  loki_data:
  promtail_data:
  alertmanager_data:
  grafana_data:

networks:
  fintech:
    driver: bridge
